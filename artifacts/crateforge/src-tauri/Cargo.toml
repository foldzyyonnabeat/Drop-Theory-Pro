[package]
name = "crateforge"
version = "0.1.0"
description = "Local-first DJ library and workstation"
authors = ["Drop Theory Pro"]
edition = "2021"

[lib]
name = "crateforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cpal = "=0.15.3"
lofty = "=0.22.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
